<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - SDO Biñan City</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .logo-glow {
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.85));
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Top Header -->
    <header class="bg-blue-900 text-white shadow-lg py-3 px-4 shrink-0 z-20">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Combined Logos & Title Section -->
            <div class="flex flex-wrap sm:flex-nowrap items-center justify-center md:justify-start gap-3 sm:gap-4 text-center sm:text-left">
                <div class="flex items-center space-x-2 sm:space-x-3 shrink-0">
                    <img src="DepED-Logo - Copy.png" alt="DepEd Logo" class="h-10 sm:h-12 w-auto object-contain logo-glow">
                    <img src="Bagong_Pilipinas_Logo.svg - Copy.png" alt="Bagong Pilipinas Logo" class="h-10 sm:h-12 w-auto object-contain logo-glow">
                    <img src="DOB_LOGO.png" alt="SDO Biñan Logo" class="h-10 sm:h-12 w-auto object-contain logo-glow">
                </div>

                <div class="hidden sm:block h-10 w-px bg-blue-700"></div>

                <div>
                    <p class="text-[11px] sm:text-xs tracking-wider text-blue-200 font-medium">Republic of the Philippines &nbsp;|&nbsp; Department of Education</p>
                    <h1 class="text-sm sm:text-base md:text-lg font-bold tracking-wide uppercase">SCHOOLS DIVISION OFFICE OF BIÑAN CITY</h1>
                </div>
            </div>

            <!-- Right Controls: Back Button -->
            <div class="flex items-center gap-3 shrink-0">
                <a href="index.html" class="bg-blue-800 hover:bg-blue-700 text-white font-semibold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Home</span>
                </a>
            </div>

        </div>
    </header>

    <!-- Content Area -->
    <div class="flex-1 overflow-y-auto flex flex-col justify-between">

        <div class="flex-1 flex items-center justify-center p-4">
            <!-- Login Card -->
            <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
                <div class="text-center mb-6">
                    <div class="w-14 h-14 bg-blue-100 text-blue-900 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900">Admin Portal</h2>
                    <p class="text-xs text-slate-500 mt-1">Authorized Super Admin and Admin access only</p>
                </div>

                <!-- Dynamic Notification Alert Box -->
                <div id="notification" class="hidden mb-5 p-3 rounded-xl text-xs font-medium flex items-center gap-2 transition-all duration-300">
                    <i id="notificationIcon" class="text-sm"></i>
                    <span id="notificationMessage"></span>
                </div>

                <!-- Form -->
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label for="username" class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
                        <div class="relative">
                            <input type="text" id="username" required placeholder="Enter username" class="w-full py-2.5 px-3 pl-9 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent">
                            <i class="fa-solid fa-user absolute left-3 top-3 text-slate-400 text-xs"></i>
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                        <div class="relative">
                            <input type="password" id="password" required placeholder="••••••••" class="w-full py-2.5 px-3 pl-9 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent">
                            <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400 text-xs"></i>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2 mt-2">
                        <i class="fa-solid fa-right-to-bracket text-xs"></i>
                        <span>Login to Dashboard</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <footer class="bg-white border-t border-slate-200 text-center py-6 text-xs text-slate-500 shrink-0">
            <p>Schools Division Office of Biñan City &copy; 2026. All Rights Reserved.</p>
            <p class="mt-1">Curriculum and Learning Management Division (CLMD)</p>
        </footer>

    </div>

    <script>
        // Initialize Supabase Client with a distinct variable name
        const SUPABASE_URL = "https://dykqemuqzthhfgostjyg.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_cWi7ZqfNlPy5Tp8IQAH1gA_DKwikowm";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Helper function for showing alerts
        function showNotification(type, message) {
            const notif = document.getElementById('notification');
            const icon = document.getElementById('notificationIcon');
            const text = document.getElementById('notificationMessage');

            notif.classList.remove('hidden', 'bg-blue-50', 'text-blue-700', 'border-blue-200', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-green-50', 'text-green-700', 'border-green-200', 'bg-amber-50', 'text-amber-700', 'border-amber-200');
            icon.className = '';

            if (type === 'info') {
                notif.classList.add('bg-blue-50', 'text-blue-700', 'border', 'border-blue-200');
                icon.className = 'fa-solid fa-circle-notch animate-spin text-blue-600';
            } else if (type === 'error') {
                notif.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
                icon.className = 'fa-solid fa-triangle-exclamation text-red-600';
            } else if (type === 'success') {
                notif.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
                icon.className = 'fa-solid fa-circle-check text-green-600';
            } else if (type === 'warning') {
                notif.classList.add('bg-amber-50', 'text-amber-700', 'border', 'border-amber-200');
                icon.className = 'fa-solid fa-shield-halved text-amber-600';
            }

            text.textContent = message;
        }

        async function handleLogin(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            // Set Loading UI State
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            showNotification('info', 'Connecting to Supabase and verifying credentials...');

            try {
                // 1. Fetch user by username using supabaseClient
                const { data: users, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', usernameInput)
                    .limit(1);

                if (error) {
                    throw error;
                }

                // 2. Check if user exists
                if (!users || users.length === 0) {
                    showNotification('error', 'Authentication failed: Username not found.');
                    resetButton();
                    return;
                }

                const user = users[0];

                // 3. Password Check
                if (user.password !== passwordInput) {
                    showNotification('error', 'Authentication failed: Incorrect password.');
                    resetButton();
                    return;
                }

                // 4. Role Verification (Only 'Super Admin' or 'Admin' allowed)
                const allowedRoles = ['Super Admin', 'Admin'];
                if (!allowedRoles.includes(user.user_role)) {
                    showNotification('warning', `Access Denied: Role "${user.user_role}" lacks administrative rights.`);
                    resetButton();
                    return;
                }

                // 5. Successful Login State
                showNotification('success', `Welcome back, ${user.username}! Redirecting to dashboard...`);

                // Store session info
                sessionStorage.setItem('adminUser', JSON.stringify({
                    username: user.username,
                    role: user.user_role
                }));

                // Redirect to admin dashboard after short pause
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 1200);

            } catch (err) {
                showNotification('error', `System Error: ${err.message || 'Unable to connect to database.'}`);
                resetButton();
            }
        }

        function resetButton() {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        }
    </script>
</body>
</html>
