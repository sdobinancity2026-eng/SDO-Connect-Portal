<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schools Data Dashboard</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-6">

  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Header -->
    <div class="bg-white p-6 rounded-xl shadow-md flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Schools Data Dashboard</h1>
        <p class="text-sm text-gray-500">Teachers and Students Distribution Matrix</p>
      </div>

      <!-- Controls -->
      <div class="flex items-center space-x-4">
        <div>
          <label for="datasetSelect" class="block text-xs font-semibold text-gray-600 uppercase mb-1">Data View</label>
          <select id="datasetSelect" onchange="handleViewChange()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="teachers">Teachers Data</option>
            <option value="students">Students Data</option>
          </select>
        </div>

        <div id="categoryWrapper">
          <label for="categorySelect" class="block text-xs font-semibold text-gray-600 uppercase mb-1">Level Category</label>
          <select id="categorySelect" onchange="loadDashboardData()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="ELEM">Elementary (ELEM)</option>
            <option value="JHS">Junior High (JHS)</option>
            <option value="SHS">Senior High (SHS)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Data Table Container -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden">
      <div id="loading" class="p-8 text-center text-gray-500">Loading data from Supabase...</div>
      <div id="tableWrapper" class="hidden overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead id="tableHead" class="bg-gray-800 text-white uppercase text-xs">
            <!-- Dynamic Headers -->
          </thead>
          <tbody id="tableBody" class="divide-y divide-gray-200">
            <!-- Dynamic Rows -->
          </tbody>
          <tfoot id="tableFoot" class="bg-gray-100 font-bold border-t-2 border-gray-300">
            <!-- Dynamic Totals -->
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Config: Replace with your actual Supabase URL & Key
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", () => {
      handleViewChange();
    });

    function handleViewChange() {
      const dataset = document.getElementById("datasetSelect").value;
      const categoryWrapper = document.getElementById("categoryWrapper");
      categoryWrapper.style.display = (dataset === "teachers") ? "block" : "none";
      loadDashboardData();
    }

    async function loadDashboardData() {
      const dataset = document.getElementById("datasetSelect").value;
      const category = document.getElementById("categorySelect").value;
      
      showLoading(true);

      if (dataset === "teachers") {
        await fetchTeachersData(category);
      } else {
        await fetchStudentsData();
      }

      showLoading(false);
    }

    async function fetchTeachersData(category) {
      const { data, error } = await supabase
        .from('schools')
        .select(`
          id,
          name,
          teachers ( male, female )
        `)
        .eq('category', category);

      if (error) {
        console.error('Error fetching teachers:', error);
        return;
      }

      const rows = data.map(school => {
        const totalMale = school.teachers ? school.teachers.reduce((s, t) => s + (t.male || 0), 0) : 0;
        const totalFemale = school.teachers ? school.teachers.reduce((s, t) => s + (t.female || 0), 0) : 0;
        return {
          id: school.id,
          name: school.name,
          male: totalMale,
          female: totalFemale,
          total: totalMale + totalFemale
        };
      });

      renderTeachersTable(rows, category);
    }

    async function fetchStudentsData() {
      const { data, error } = await supabase
        .from('schools')
        .select(`
          id,
          name,
          students ( elem_male, elem_female, jhs_male, jhs_female, g11_male, g11_female, g12_male, g12_female )
        `);

      if (error) {
        console.error('Error fetching students:', error);
        return;
      }

      const rows = data.map(school => {
        const s = (school.students && school.students[0]) ? school.students[0] : {};
        const elemM = s.elem_male || 0, elemF = s.elem_female || 0;
        const jhsM = s.jhs_male || 0, jhsF = s.jhs_female || 0;
        const g11M = s.g11_male || 0, g11F = s.g11_female || 0;
        const g12M = s.g12_male || 0, g12F = s.g12_female || 0;

        return {
          id: school.id,
          name: school.name,
          elem: { m: elemM, f: elemF, total: elemM + elemF },
          jhs:  { m: jhsM, f: jhsF, total: jhsM + jhsF },
          g11:  { m: g11M, f: g11F, total: g11M + g11F },
          g12:  { m: g12M, f: g12F, total: g12M + g12F },
          grandTotal: (elemM + elemF + jhsM + jhsF + g11M + g11F + g12M + g12F)
        };
      });

      renderStudentsTable(rows);
    }

    function renderTeachersTable(rows, category) {
      const thead = document.getElementById("tableHead");
      const tbody = document.getElementById("tableBody");
      const tfoot = document.getElementById("tableFoot");

      thead.innerHTML = `
        <tr>
          <th class="p-3 w-12 text-center">No.</th>
          <th class="p-3">School Name (${category})</th>
          <th class="p-3 text-center bg-blue-900">Male Teachers</th>
          <th class="p-3 text-center bg-pink-900">Female Teachers</th>
          <th class="p-3 text-center bg-gray-900">Total Teachers</th>
        </tr>
      `;

      let totalM = 0, totalF = 0;
      tbody.innerHTML = rows.map((r, i) => {
        totalM += r.male;
        totalF += r.female;
        return `
          <tr class="hover:bg-gray-50 border-b">
            <td class="p-3 text-center font-mono text-xs">${i + 1}</td>
            <td class="p-3 font-semibold">${r.name}</td>
            <td class="p-3 text-center text-blue-600 font-medium">${r.male}</td>
            <td class="p-3 text-center text-pink-600 font-medium">${r.female}</td>
            <td class="p-3 text-center font-bold text-gray-900">${r.total}</td>
          </tr>
        `;
      }).join('');

      tfoot.innerHTML = `
        <tr>
          <td colspan="2" class="p-3 text-right">GRAND TOTAL:</td>
          <td class="p-3 text-center text-blue-700">${totalM}</td>
          <td class="p-3 text-center text-pink-700">${totalF}</td>
          <td class="p-3 text-center text-gray-900">${totalM + totalF}</td>
        </tr>
      `;
    }

    function renderStudentsTable(rows) {
      const thead = document.getElementById("tableHead");
      const tbody = document.getElementById("tableBody");
      const tfoot = document.getElementById("tableFoot");

      thead.innerHTML = `
        <tr>
          <th rowspan="2" class="p-3 w-12 text-center border">No.</th>
          <th rowspan="2" class="p-3 border">School Name</th>
          <th colspan="3" class="p-2 text-center border bg-emerald-800">Elementary</th>
          <th colspan="3" class="p-2 text-center border bg-indigo-800">Junior High</th>
          <th colspan="3" class="p-2 text-center border bg-amber-800">Grade 11</th>
          <th colspan="3" class="p-2 text-center border bg-rose-800">Grade 12</th>
          <th rowspan="2" class="p-3 text-center border bg-gray-900">Grand Total</th>
        </tr>
        <tr class="text-xs">
          <th class="p-1 text-center bg-emerald-700">M</th><th class="p-1 text-center bg-emerald-700">F</th><th class="p-1 text-center bg-emerald-900">Total</th>
          <th class="p-1 text-center bg-indigo-700">M</th><th class="p-1 text-center bg-indigo-700">F</th><th class="p-1 text-center bg-indigo-900">Total</th>
          <th class="p-1 text-center bg-amber-700">M</th><th class="p-1 text-center bg-amber-700">F</th><th class="p-1 text-center bg-amber-900">Total</th>
          <th class="p-1 text-center bg-rose-700">M</th><th class="p-1 text-center bg-rose-700">F</th><th class="p-1 text-center bg-rose-900">Total</th>
        </tr>
      `;

      let sumEleM = 0, sumEleF = 0, sumJhsM = 0, sumJhsF = 0;
      let sumG11M = 0, sumG11F = 0, sumG12M = 0, sumG12F = 0;

      tbody.innerHTML = rows.map((r, i) => {
        sumEleM += r.elem.m; sumEleF += r.elem.f;
        sumJhsM += r.jhs.m;  sumJhsF += r.jhs.f;
        sumG11M += r.g11.m;  sumG11F += r.g11.f;
        sumG12M += r.g12.m;  sumG12F += r.g12.f;

        return `
          <tr class="hover:bg-gray-50 border-b text-center">
            <td class="p-2 font-mono text-xs">${i + 1}</td>
            <td class="p-2 text-left font-semibold">${r.name}</td>
            <td class="p-2">${r.elem.m}</td><td class="p-2">${r.elem.f}</td><td class="p-2 font-semibold bg-gray-50">${r.elem.total}</td>
            <td class="p-2">${r.jhs.m}</td><td class="p-2">${r.jhs.f}</td><td class="p-2 font-semibold bg-gray-50">${r.jhs.total}</td>
            <td class="p-2">${r.g11.m}</td><td class="p-2">${r.g11.f}</td><td class="p-2 font-semibold bg-gray-50">${r.g11.total}</td>
            <td class="p-2">${r.g12.m}</td><td class="p-2">${r.g12.f}</td><td class="p-2 font-semibold bg-gray-50">${r.g12.total}</td>
            <td class="p-2 font-bold text-blue-700 bg-gray-100">${r.grandTotal}</td>
          </tr>
        `;
      }).join('');

      const totalStudents = sumEleM + sumEleF + sumJhsM + sumJhsF + sumG11M + sumG11F + sumG12M + sumG12F;

      tfoot.innerHTML = `
        <tr class="text-center">
          <td colspan="2" class="p-3 text-right">TOTALS:</td>
          <td class="p-2">${sumEleM}</td><td class="p-2">${sumEleF}</td><td class="p-2">${sumEleM + sumEleF}</td>
          <td class="p-2">${sumJhsM}</td><td class="p-2">${sumJhsF}</td><td class="p-2">${sumJhsM + sumJhsF}</td>
          <td class="p-2">${sumG11M}</td><td class="p-2">${sumG11F}</td><td class="p-2">${sumG11M + sumG11F}</td>
          <td class="p-2">${sumG12M}</td><td class="p-2">${sumG12F}</td><td class="p-2">${sumG12M + sumG12F}</td>
          <td class="p-2 text-blue-900 font-bold">${totalStudents}</td>
        </tr>
      `;
    }

    function showLoading(isLoading) {
      document.getElementById("loading").classList.toggle("hidden", !isLoading);
      document.getElementById("tableWrapper").classList.toggle("hidden", isLoading);
    }
  </script>
</body>
</html>
